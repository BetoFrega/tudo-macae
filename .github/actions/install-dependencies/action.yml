name: Install dependencies
description: Set up pnpm and Node 24 with the pnpm store cache and install the locked dependencies.

runs:
  using: composite
  steps:
    - uses: pnpm/setup@v3
      with:
        runtime: node@24
        cache: true
        install: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
