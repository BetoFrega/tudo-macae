name: Deploy production

on:
  push:
    branches: [main]
  # Retries deliver main as it stands. A caller-chosen ref would run untrusted code with
  # the default branch's cache scope (CodeQL actions/cache-poisoning).
  workflow_dispatch: {}

# Each run delivers main up to its SHA, so a newer push supersedes older runs. Checks
# yield to the newer run; each mutation job runs one at a time and is never cancelled
# mid-publish, while a newer pending run replaces an older one in its group.
permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    # Nothing here mutates production, so a newer run cancels it.
    concurrency:
      group: production-delivery-checks
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
    steps:
      - name: Fix the candidate for this run
        id: candidate
        env:
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          candidate="$DEFAULT_SHA"
          if ! [[ "$candidate" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Informe um SHA completo de 40 caracteres."
            exit 1
          fi

          echo "sha=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Require a SHA already on main
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          git merge-base --is-ancestor "$SHA" origin/main
      - name: Require Worker delivery support in the selected SHA
        run: test -f bin/deploy-workers-production.mjs
      - name: Require API Worker delivery support in the selected SHA
        run: test -f bin/deploy-api-worker-production.mjs
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The selected SHA builds the web Worker the way its own delivery script will.
      - name: Build web Worker before production mutation
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          if test -f wrangler.web.jsonc; then
            CLOUDFLARE_ENV=production WEB_ASSET_RELEASE="$RELEASE_SHA" pnpm exec vite build --config vite.vinext.config.ts --logLevel warn
            # The build's Wrangler redirect makes later Wrangler runs in apps/* refuse their own config.
            rm -rf .wrangler/deploy
          elif test -f apps/web-workers/package.json; then
            pnpm exec turbo run build --filter=web-workers-app
          fi
      # The bundle that production will serve must answer pages before anything is published.
      - name: Smoke the web Worker bundle before production mutation
        env:
          XDG_CONFIG_HOME: /tmp/wrangler-config
        run: |
          if test -f wrangler.web.jsonc && test -f bin/web-bundle-smoke.mjs; then
            node bin/web-bundle-smoke.mjs
          else
            echo "::notice::The selected SHA predates the web Worker bundle smoke."
          fi
      # The PR Checks run turbo only on affected apps; delivery checks every app at this SHA.
      - name: Type-check, build and test every Worker app
        env:
          RELEASE_SHA: ${{ steps.candidate.outputs.sha }}
          XDG_CONFIG_HOME: /tmp/wrangler-config
        run: pnpm exec turbo run typecheck build test --filter='!//' --filter='!@tudomacae/e2e' --filter='!./packages/*' --only --concurrency=2
      - name: Check the public images delivery script
        run: node --test apps/public-images/deploy.test.mjs
      - run: pnpm run lint
        env:
          DOMAIN_SEAMS_BASE: ${{ steps.candidate.outputs.sha }}^
      - name: Check Worker HTTP, authorization and persistence contracts
        run: pnpm run test:worker
      - name: Check Vitest unit tier
        run: pnpm test --tier=unit --bail=1
      - name: Check Vitest integration tier and application build before production mutation
        run: pnpm test --tier=integration --bail=1 && pnpm run build:check
      - run: pnpm --filter @tudomacae/e2e exec playwright install --with-deps chromium
      - name: Check E2E journeys and harness on a disposable local stack
        run: pnpm run test:e2e:full --max-failures=1
      - name: Retain sanitized test diagnostics
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/vitest-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Retain Playwright report and traces
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  production:
    needs: [checks]
    environment: production
    # Cancelling mid-migration or mid-publish would leave production half-delivered.
    concurrency:
      group: production-delivery-api
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.checks.outputs.sha }}
      RUNTIME_ACCOUNT: cloud-run-www-runtime@macaetem-dev.iam.gserviceaccount.com
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          lfs: true
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Require production D1 migrations ready
        env:
          CLOUDFLARE_ACCOUNT_ID: abd87961a304b923acbc329f0b0d1919
          CLOUDFLARE_ZONE_ID: 7d4facb5dc453abcb1bf72c6508245cc
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_ZONE_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          if ! result="$(./node_modules/.bin/wrangler d1 migrations list DB --remote --config apps/public-article-index/wrangler.jsonc --env production 2>&1)"; then
            echo "::error::Could not read production D1 migrations."
            exit 1
          fi
          if [[ "$result" != *"No migrations to apply!"* ]]; then
            echo "::error::Production D1 has pending migrations. Apply and verify them before delivery."
            exit 1
          fi
      - name: Require web Worker and CI access before delivery
        env:
          CLOUDFLARE_ACCOUNT_ID: abd87961a304b923acbc329f0b0d1919
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if ! ./node_modules/.bin/wrangler deployments status --config apps/web-workers/wrangler.jsonc --env production --json >/dev/null 2>&1; then
            echo "::error::Bootstrap the production web Worker and grant the CI token access before delivery."
            exit 1
          fi
      # The web Worker reads the API Worker, so the API publishes first.
      - name: Apply migrations, publish and read back the production API Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: abd87961a304b923acbc329f0b0d1919
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AUTHENTICATION_D1_ID: ed48dac0-069a-4889-8da7-71c543fe2722
          CLASSIFIEDS_D1_ID: a76337a4-7cef-4198-9711-f99a8716ea6c
          EDITORIAL_D1_ID: 38903d3f-3204-497d-8ba9-f9b8bb69753a
          # Blog saves and the hourly reconciliation reach the index through this binding.
          PUBLIC_ARTICLE_INDEX_SERVICE: tudo-macae-public-article-index
          AUTHENTICATION_API_ORIGIN: https://tudo-macae-api-production.frega.workers.dev
          AUTHENTICATION_RUNTIME_ACCOUNT: ${{ env.RUNTIME_ACCOUNT }}
          PUBLIC_IMAGE_PURGE_ZONE_ID: 7d4facb5dc453abcb1bf72c6508245cc
          # Empty deploys without the daily Classifieds supply snapshot; set it once the EU bucket exists.
          PDM_EXPORTS_BUCKET: ${{ vars.PDM_EXPORTS_BUCKET }}
          # Empty enforces Turnstile; set the variable to off only while the serving Next sends no token.
          TURNSTILE_ENFORCEMENT: ${{ vars.TURNSTILE_ENFORCEMENT }}
        run: node bin/deploy-api-worker-production.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: api-worker-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/api-worker-recovery.json
          retention-days: 90
          if-no-files-found: ignore

  workers:
    needs: [checks, production]
    environment: production
    # Its own group: a newer run's API Worker may publish while this job runs, which the
    # API's compatibility with the serving web Worker allows; sharing the API's group would
    # let this job's pending entry replace the newer run's API job. Cancelling mid-publish
    # would also skip the web Worker page gate and its rollback.
    concurrency:
      group: production-delivery-workers
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_SHA: ${{ needs.checks.outputs.sha }}
      CLOUDFLARE_ACCOUNT_ID: abd87961a304b923acbc329f0b0d1919
      CLOUDFLARE_ZONE_ID: 7d4facb5dc453abcb1bf72c6508245cc
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          # The web Worker bundles the app's `public/` PNGs, which live in Git LFS.
          lfs: true
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          runtime: node@24
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - name: Publish and read back production Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node bin/deploy-workers-production.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: workers-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workers-recovery.json
          retention-days: 90
          if-no-files-found: ignore

  outcome:
    if: always() && github.ref == 'refs/heads/main'
    needs: [checks, production, workers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update the delivery correction ticket
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.checks.outputs.sha || github.sha }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          PRODUCTION_RESULT: ${{ needs.production.result }}
          WORKERS_RESULT: ${{ needs.workers.result }}
        run: node bin/deployment-ticket.mjs
