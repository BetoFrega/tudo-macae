name: Checks

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Each check runs on its own runner so they finish in parallel.
jobs:
  typecheck:
    name: Typecheck
    if: >-
      !github.event.pull_request.draft
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-dependencies
      - uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ github.sha }}
          restore-keys: tsbuildinfo-
      - run: npm run typecheck

  lint:
    name: Lint
    if: >-
      !github.event.pull_request.draft
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      # The domain-seams check diffs against origin/<base branch>.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/eslint
          key: eslint-${{ github.sha }}
          restore-keys: eslint-
      - run: npm run lint

  workers:
    name: Web Workers
    if: >-
      !github.event.pull_request.draft
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: origin/${{ github.base_ref }}
      TURBO_SCM_HEAD: HEAD
      RELEASE_SHA: ${{ github.sha }}
      XDG_CONFIG_HOME: /tmp/wrangler-config
    steps:
      # turbo --affected needs the merge base with the base branch.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-dependencies
      - name: Type-check and build the affected Workers
        run: npx turbo run typecheck build --affected --filter='!//' --filter='!@tudomacae/e2e' --filter='!./packages/*' --only --concurrency=2
      # Only this build and smoke serve the vinext bundle that production runs; no secrets are
      # needed (`WEB_ASSET_RELEASE` only has to be 40 hex digits, the vars come from wrangler.web.jsonc).
      - name: Build and smoke the production web Worker bundle
        run: |
          CLOUDFLARE_ENV=production WEB_ASSET_RELEASE="$RELEASE_SHA" npx vite build --config vite.vinext.config.ts --logLevel warn
          node bin/web-bundle-smoke.mjs
          # The build's Wrangler redirect makes later Wrangler runs in apps/* refuse their own config.
          rm -rf .wrangler/deploy
      # Worker runtime tests and the unit tier already run every other Worker test.
      - name: Test the web-workers app pages
        run: npm test --workspace=web-workers-app
      - name: Test the public-images deployment configuration
        run: node --test apps/public-images/deploy.test.mjs

  worker-runtime:
    name: Worker runtime tests
    if: >-
      !github.event.pull_request.draft
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/install-dependencies
      - name: Test every Worker's HTTP, authorization and persistence contracts
        run: npm run test:worker

  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    if: >-
      !github.event.pull_request.draft
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: ./.github/actions/install-dependencies
      - run: npm run test:unit -- --shard=${{ matrix.shard }}/2
