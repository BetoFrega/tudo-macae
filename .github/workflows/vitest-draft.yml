name: Vitest Tests (draft opt-in)

on:
  pull_request:
    types: [labeled]
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Vitest Tests (draft opt-in)
    if: >-
      github.event.pull_request.draft
      && github.event.label.name == 'run-ci'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run complete Vitest collection
        uses: ./.github/actions/run-vitest
