name: Run complete Vitest collection
description: Run only the integration tier; the Checks workflow runs the unit tier.

runs:
  using: composite
  steps:
    - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        runtime: node@24
        cache: true
        install: false

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Run Vitest integration tier
      shell: bash
      run: pnpm test --tier=integration --bail=1

    - name: Retain complete sanitized Vitest output
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: vitest-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
        path: test-results/vitest-logs/
        retention-days: 7
        if-no-files-found: error
